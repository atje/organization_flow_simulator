name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdowlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'
